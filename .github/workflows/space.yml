# Publie la démo en ligne sur Hugging Face Spaces après chaque push sur main (si le secret HF_TOKEN existe).
name: Démo Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'edouardmnt04/foulee' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Publier sur le Space
        if: env.HF_TOKEN != ''
        run: |
          pip install huggingface_hub
          python deploy/huggingface/push_space.py --space "$HF_SPACE"
      - name: Pas de jeton Hugging Face
        if: env.HF_TOKEN == ''
        run: echo "Secret HF_TOKEN absent : publication de la démo ignorée."
