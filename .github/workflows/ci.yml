name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/edouardmnt/garmin-run

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Installer les dépendances de test
        run: pip install -r requirements-test.txt

      - name: Vérifier la qualité du code (ruff)
        run: ruff check .

      - name: Lancer tous les tests, rapides et lents, en parallèle (pytest-xdist)
        run: pytest -n auto --durations=15

      - name: Valider les manifestes Kubernetes (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  docker:
    # Construit et teste l'image EN MÊME TEMPS que les tests (gain de temps) ; la publication, elle,
    # attend que les deux soient verts : une image n'est jamais publiée si un seul test échoue.
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: garmin-run:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tester l'image (pipeline de démo dans le conteneur)
        run: docker run --rm garmin-run:test demo

  publish:
    needs: [test, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image (reconstruite depuis le cache, quelques secondes)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
