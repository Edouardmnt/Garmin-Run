[project]
name = "garmin-run"
version = "0.1.0"
description = "Charge d'entraînement et récupération multisport à partir de données Garmin"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["notebooks"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
