# Configuration non sensible du pipeline (lab 2)
apiVersion: v1
kind: ConfigMap
metadata:
  name: garmin-config
  namespace: garmin-run
data:
  RUNLAB_DATA_DIR: /data
  GARMIN_DAYS: "200"                   # profondeur du chargement initial, si le volume est vide.
                                       # Ensuite, la synchro repart du dernier jour connu (watermark).
  GARMINTOKENS: /data/.garminconnect   # jetons sur le volume : ils survivent aux Jobs et se rafraîchissent
  # Coach IA : Ollama tourne sous Windows ; minikube donne accès à la machine hôte par ce nom
  OLLAMA_URL: http://host.minikube.internal:11434
  # Sur processeur, un modèle de 3 milliards de paramètres répond environ deux fois plus vite qu'un 7 milliards.
  # Avec une carte graphique compatible, qwen2.5:7b donne des réponses plus fines.
  OLLAMA_MODEL: qwen2.5:3b
  COACH_MODE: direct         # "outils" : le modèle choisit ses outils (plusieurs appels, réservé aux GPU)
