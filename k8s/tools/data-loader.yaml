# Pod utilitaire pour accéder au volume : y copier les données initiales, inspecter les résultats.
# À supprimer après usage : kubectl delete -f k8s/tools/data-loader.yaml
apiVersion: v1
kind: Pod
metadata:
  name: data-loader
  namespace: garmin-run
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: garmin-data
